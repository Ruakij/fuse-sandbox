name: release

# v1.2.3 is a release, anything with a suffix (v1.2.3-rc.1) a prerelease.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make dist VERSION=${{ github.ref_name }}
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/fuse-sandbox-*
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=
          case "${GITHUB_REF_NAME}" in *-*) prerelease=--prerelease ;; esac
          gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes ${prerelease}

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # major.minor and major are skipped for prereleases by the action itself.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          build-args: version=${{ github.ref_name }}
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/386,linux/riscv64,linux/ppc64le,linux/s390x
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
