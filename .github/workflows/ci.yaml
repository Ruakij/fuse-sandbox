name: ci

on:
  push:
    branches: [main]
  pull_request:
  # A CVE published after a merge is still our problem, so rescan daily.
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A push supersedes the run of the commit before it, so drop that one instead of
# waiting for a verdict on code nobody has any more.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: gofmt -l cmd internal pkg test | tee /dev/stderr | (! read)
      - run: go mod tidy -diff
      - run: go vet ./...
      - name: go vet (mount tests)
        run: go vet -tags mounttest ./...
      - run: go test -race ./...
      # Every architecture the release ships, so a break there shows up before a tag.
      - run: make dist
      # Read from a plain file so the upstream-sync workflow can bump it without a
      # token carrying the workflow scope.
      - id: lint-version
        run: echo "version=$(cat hack/golangci-lint.version)" >> "$GITHUB_OUTPUT"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ steps.lint-version.outputs.version }}

  fuzz:
    runs-on: ubuntu-latest
    # Fuzzing unchanged code finds less each time; the daily run is for CVEs.
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Fuzzing is cumulative: each run starts from the corpus of the ones before.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build/fuzz
          key: ${{ github.job }}-${{ github.run_id }}
          restore-keys: ${{ github.job }}-
      - run: make fuzz
      # Commit a failing input to testdata/fuzz to keep it as a regression test.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ github.job }}-failing-input
          path: "**/testdata/fuzz/"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Reachability-aware, so it only fails on vulnerabilities we actually call.
      # It installs its own Go, hence no setup-go step; go-version-input must be
      # cleared or it collides with go-version-file.
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          repo-checkout: false
          go-version-file: go.mod
          go-version-input: ""
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  # Real sandboxes around a real FUSE daemon. The runner is a VM with its own
  # kernel, so a privileged container is enough; no nested VM is involved.
  mount:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: test -c /dev/fuse || (echo "runner has no /dev/fuse" >&2; exit 1)
      - run: make test-mount

  fuzz-mount:
    runs-on: ubuntu-latest
    # Fuzzing unchanged code finds less each time; the daily run is for CVEs.
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: test -c /dev/fuse || (echo "runner has no /dev/fuse" >&2; exit 1)
      # Fuzzing is cumulative: each run starts from the corpus of the ones before.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build/fuzz
          key: ${{ github.job }}-${{ github.run_id }}
          restore-keys: ${{ github.job }}-
      - run: make fuzz-mount
      # Commit a failing input to testdata/fuzz to keep it as a regression test.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ github.job }}-failing-input
          path: "**/testdata/fuzz/"

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: fuse-sandbox:ci
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: fuse-sandbox:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
