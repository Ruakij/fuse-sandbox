name: ci

on:
  push:
    # automation/** is here because upstream-sync pushes those branches over SSH.
    # A PR it opens cannot fire pull_request, but the push can, and the checks
    # land on the same commit either way.
    branches: [main, "automation/**"]
  pull_request:
  # A CVE published after a merge is still our problem, so rescan daily.
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A push supersedes the run of the commit before it, so drop that one instead of
# waiting for a verdict on code nobody has any more.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: gofmt -l cmd internal pkg test | tee /dev/stderr | (! read)
      - run: go vet ./...
      - name: go vet (mount tests)
        run: go vet -tags mounttest ./...
      - run: go test -race ./...
      # Every architecture the release ships, so a break there shows up before a tag.
      - run: make dist
      # Read from a plain file so the upstream-sync workflow can bump it without a
      # token carrying the workflow scope.
      - id: lint-version
        run: echo "version=$(cat hack/golangci-lint.version)" >> "$GITHUB_OUTPUT"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ steps.lint-version.outputs.version }}

  fuzz:
    runs-on: ubuntu-latest
    # Fuzzing unchanged code finds less each time; the daily run is for CVEs.
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Fuzzing is cumulative: each run starts from the corpus of the ones before.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/go-build/fuzz
          key: ${{ github.job }}-${{ github.run_id }}
          restore-keys: ${{ github.job }}-
      - run: make fuzz
      # Commit a failing input to testdata/fuzz to keep it as a regression test.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.job }}-failing-input
          path: "**/testdata/fuzz/"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Reachability-aware, so it only fails on vulnerabilities we actually call.
      # It installs its own Go, hence no setup-go step; go-version-input must be
      # cleared or it collides with go-version-file.
      - uses: golang/govulncheck-action@v1.1.0
        with:
          repo-checkout: false
          go-version-file: go.mod
          go-version-input: ""
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  # Real sandboxes around a real FUSE daemon. The runner is a VM with its own
  # kernel, so a privileged container is enough; no nested VM is involved.
  mount:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: test -c /dev/fuse || (echo "runner has no /dev/fuse" >&2; exit 1)
      - run: make test-mount

  fuzz-mount:
    runs-on: ubuntu-latest
    # Fuzzing unchanged code finds less each time; the daily run is for CVEs.
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7
      - run: test -c /dev/fuse || (echo "runner has no /dev/fuse" >&2; exit 1)
      # Fuzzing is cumulative: each run starts from the corpus of the ones before.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/go-build/fuzz
          key: ${{ github.job }}-${{ github.run_id }}
          restore-keys: ${{ github.job }}-
      - run: make fuzz-mount
      # Commit a failing input to testdata/fuzz to keep it as a regression test.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.job }}-failing-input
          path: "**/testdata/fuzz/"

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: fuse-sandbox:ci
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: fuse-sandbox:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
